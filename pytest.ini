[pytest]
# Every stage script does `from scripts.utils import ...` / `from scripts.sources import ...`,
# which requires the repo root (not tests/) on sys.path so the `scripts`/`config` packages
# resolve. `pythonpath` (pytest>=7) is the ini-level equivalent of a conftest.py sys.path hack.
pythonpath = .
testpaths = tests

# The default suite stays fully mocked, dependency-free and ~1.5s, which is what makes it
# usable as a per-change gate (and what .github/workflows/tests.yml relies on — it installs no
# browser). Stage 7's Layer 2 tests drive a real Chromium against a local file:// fixture:
# genuinely valuable, but ~80s and needing `playwright install chromium`. So they're marked and
# deselected by default; run them explicitly with `pytest -m browser` when touching
# scripts/autoapply_browser.py.
addopts = -m "not browser"
markers =
    browser: drives a real headless browser; needs `playwright install chromium` (deselected by default)

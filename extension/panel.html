<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>CareerPilot Auto-Apply</title>
<style>
  body {
    font: 13px/1.5 -apple-system, "Segoe UI", Roboto, sans-serif;
    margin: 0;
    padding: 12px;
    color: #222;
  }
  h1 { font-size: 14px; margin: 0 0 10px; }
  #job-match { font-weight: 600; margin-bottom: 10px; }
  #resume-section p { margin: 4px 0; }
  #candidates div, #job-list div {
    padding: 4px 6px;
    border: 1px solid #e2e2e2;
    border-radius: 3px;
    margin-bottom: 4px;
    cursor: default;
  }
  #job-list div { cursor: pointer; }
  #job-list div:hover { background: #f5f5f5; }
  #job-list .cpai-title { font-weight: 600; }
  #job-list .cpai-score { float: right; color: #666; }
  button { font: inherit; padding: 3px 10px; }
  #copy-status { color: #0a7a34; font-size: 12px; min-height: 1em; }
  #confirm-applied-status { font-size: 12px; min-height: 1em; }
  #drafts-section { margin-top: 10px; border-top: 1px solid #e2e2e2; padding-top: 8px; }
  .cpai-draft-row { margin-bottom: 10px; }
  .cpai-draft-label { font-weight: 600; margin-bottom: 4px; }
  .cpai-draft-text { width: 100%; min-height: 70px; font: inherit; box-sizing: border-box; }
</style>
</head>
<body>
  <h1>CareerPilot Auto-Apply</h1>
  <div id="job-match">Loading…</div>
  <div id="resume-section" hidden>
    <p><strong>Resume:</strong> <span id="resume-filename"></span></p>
    <button id="copy-path-btn" type="button">Copy path</button>
    <p id="copy-status"></p>
  </div>
  <div id="confirm-applied-section" hidden>
    <button id="confirm-applied-btn" type="button">Confirm Applied</button>
    <p id="confirm-applied-status"></p>
  </div>
  <div id="candidates" hidden></div>
  <div id="job-list" hidden></div>
  <div id="drafts-section" hidden>
    <button id="load-drafts-btn" type="button">Load draft answers</button>
    <div id="drafts-list"></div>
  </div>
  <script src="panel.js"></script>
  <script src="drafts.js"></script>
</body>
</html>

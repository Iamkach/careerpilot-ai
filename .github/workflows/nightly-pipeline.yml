name: Nightly job search pipeline

# Runs the pipeline unattended off-hours, using a hybrid AI provider setup:
#   FAST_PROVIDER=claude       (metered API)   — stage 1 scoring, stage 3 outreach (many small calls)
#   QUALITY_PROVIDER=claude_code (subscription) — stage 2 tailor, stage 5/6 (few, larger calls)
# Subscription auth works headlessly via CLAUDE_CODE_OAUTH_TOKEN, minted once locally with
# `claude setup-token` (requires Claude Pro/Max) and stored as a repo secret. This only makes
# sense off-hours: at midnight the subscription's 5-hour usage window isn't competing with any
# interactive Claude Code session, so it costs no marginal $ instead of contending with daytime use.
#
# NOTE: cron below is UTC and has no timezone concept — 07:00 UTC ≈ midnight US Central (CST,
# UTC-6) / 1am CDT (UTC-5). Adjust the hour to match your local off-hours window and DST offset.
on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "What to run"
        required: true
        default: "full"
        type: choice
        options:
          - full        # scrape+digest, then evaluate (tailor+outreach+digest) for already-Reviewed jobs
          - scrape       # python run.py            (stage 1 + 4)
          - evaluate     # python run.py --evaluate  (stage 2 + 3 + 4)
          - ingest        # python run.py --ingest    (Notion "Interested" only)
          - stage2
          - stage3
          - stage4
          - stage5
          - stage6

permissions:
  contents: write   # nightly publish-resumes step pushes to the tailored-resumes branch

env:
  NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
  NOTION_DB_ID: ${{ secrets.NOTION_DB_ID }}
  APIFY_API_TOKEN: ${{ secrets.APIFY_API_TOKEN }}
  ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
  CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
  FAST_PROVIDER: claude
  QUALITY_PROVIDER: claude_code

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Write profile.json from secrets
        env:
          PROFILE_JSON: ${{ secrets.PROFILE_JSON }}
        run: |
          [ -n "$PROFILE_JSON" ] && printf '%s' "$PROFILE_JSON" > config/profile.json
          true

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Claude Code CLI (subscription auth transport)
        run: npm install -g @anthropic-ai/claude-code

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Verify setup
        run: python run.py --setup

      - name: Run pipeline
        env:
          MODE: ${{ github.event.inputs.mode || 'full' }}
        run: |
          case "$MODE" in
            full)
              python run.py
              python run.py --evaluate
              ;;
            scrape)   python run.py ;;
            evaluate) python run.py --evaluate ;;
            ingest)   python run.py --ingest ;;
            stage2)   python run.py --stage 2 ;;
            stage3)   python run.py --stage 3 --no-confirm ;;
            stage4)   python run.py --stage 4 ;;
            stage5)   python run.py --stage 5 --no-confirm ;;
            stage6)   python run.py --stage 6 ;;
            *) echo "Unknown mode: $MODE"; exit 1 ;;
          esac

      # Stage 2 writes Tailored Resume Link as a file:// path when GITHUB_ACTIONS is set — dead
      # on arrival, since the runner's filesystem is gone once the job ends. Publish the actual
      # .docx files to a dedicated orphan branch instead, so Notion can carry a stable
      # raw.githubusercontent.com URL (see scripts/stage2_tailor.py::_tailored_resume_link()).
      # Additive only: this run's files are copied on top of the branch's existing tree, never
      # replacing it, since older Notion rows may still point at a prior run's resume.
      #
      # NOTE: this step is GitHub-only, same as "Bundle run output" below — local `python run.py`
      # never touches this, so local runs keep writing file:// as before.
      - name: Publish tailored resumes to tailored-resumes branch
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -e
          shopt -s nullglob
          docx_files=(output/resumes/*.docx)
          if [ ! -d output/resumes ] || [ ${#docx_files[@]} -eq 0 ]; then
            echo "No tailored resumes to publish."
            exit 0
          fi

          REPO_URL="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          WORKDIR="$(mktemp -d)"

          if ! git clone --depth=1 --branch tailored-resumes "$REPO_URL" "$WORKDIR" 2>/dev/null; then
            git clone --depth=1 "$REPO_URL" "$WORKDIR"
            (cd "$WORKDIR" && git checkout --orphan tailored-resumes && git rm -rf . >/dev/null 2>&1 || true)
          fi

          mkdir -p "$WORKDIR/output/resumes"
          cp "${docx_files[@]}" "$WORKDIR/output/resumes/"

          cd "$WORKDIR"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/resumes
          if git diff --cached --quiet; then
            echo "No new/changed resumes."
            exit 0
          fi
          git commit -m "Publish tailored resumes — nightly run #${GITHUB_RUN_NUMBER}"
          git push origin tailored-resumes

      # The runner's filesystem is discarded when the job ends, so every file a stage writes
      # to output/ (tailored .docx resumes, outreach drafts, digest/prep/negotiation HTML,
      # stage 7 answer sheets) would be lost. Upload the whole dir as one artifact instead —
      # actions/upload-artifact zips it on download, so this is a single batch download from
      # the run's summary page rather than fishing out one resume at a time.
      #
      # `if: always()` on purpose: a crashed run is exactly when the partial output and any
      # stage 7 screenshots are worth reading. That also means this can fire when an earlier
      # step died before output/ existed at all, hence if-no-files-found: warn — a missing
      # dir must not turn an otherwise-green run red.
      #
      # NOTE: this step is GitHub-only. Local `python run.py` never parses this file, so local
      # runs are untouched and keep writing to output/ as before.
      - name: Bundle run output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: careerpilot-output-${{ github.run_number }}
          path: output/
          retention-days: 30
          if-no-files-found: warn
